name: Sync SOL decisions into governing log

on:
  push:
    branches:
      - migration/solana-strategy-ready
    paths:
      - .github/workflows/sync-sol-decisions.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/solana-strategy-ready
      - name: Append approved SOL decisions if missing
        shell: bash
        run: |
          if grep -q '^## D-039 — Transition production plan from BTC to SOL' docs/implementation-decision-log.md; then
            echo "SOL decisions already synchronized."
            exit 0
          fi
          cat >> docs/implementation-decision-log.md <<'EOF'

## D-039 — Transition production plan from BTC to SOL

**Status:** APPROVED by owner on 2026-08-23.

The production plan changes from BTC to SOL. Binance `SOLUSDT` is the external strategy/reference market and DXtrade `SOL/USD` is the account/broker instrument. BTC production-grid parameters are historical only and must not be copied into SOL. SOL state, execution identity, and broker reconciliation are isolated from old BTC grid state. Exactly one production instrument is enabled. Automatic execution remains off pending the separate activation gate.

Full decision: `docs/decisions/D-039-solana-transition.md`.

## D-040 — Frozen SOL outer-heavy grid baseline

**Status:** APPROVED by owner on 2026-08-23.

Freeze strategy `sol-outer-heavy-v1`: completed-day 200-day SOL SMA anchor; 4.5% bands; dead zone inside ±18%; 8 BUY and 8 SHORT rings from ±22.5% through ±54%; `$6 × 1.8^(level-1)` USD sizing floored to 0.01 SOL; up to two virtual lots per ring; 0.5-band moving-ring re-arm; four dynamic-MA exit tranches with 0.18% round-trip cost floor; `$1,830` gross virtual-exposure ceiling; `$1,500` continuous daily-loss protection; 0.01 SOL inactivity heartbeat; no BTC confirmed-fill reference reset, three-level counters, or consecutive-fill reset model.

The verified research engine's independent tagged long/short lots are represented in production as durable virtual lots reconciled to the one signed net DXtrade `SOL/USD` position. Persistent virtual/broker mismatch fails closed.

Full decision: `docs/decisions/D-040-sol-outer-heavy-v1.md`.

## D-041 — SOL live-touch production semantics

**Status:** APPROVED by owner on 2026-08-23.

Translate the frozen five-minute research touch model to production using actual live Binance `SOLUSDT` trade touches. On every live update, observe moving-ring re-arm conditions, process all eligible exits before entries, and advance durable strategy state only after confirmed DXtrade fills. Shadow/locked operation may emit intents but must never pretend they filled. The completed-day 200-day MA remains the moving reference.

D-041 authorizes implementation, not live automatic execution. The D-038 minimum-size live lifecycle canary remains separately owner-approved, followed by a separate final automatic-execution approval. `AUTO_EXECUTE=false` and `config/strategy.json` → `execution.autoExecute=false` remain required until that final activation decision.

Full decision: `docs/decisions/D-041-sol-live-touch-production-semantics.md`.
EOF
      - name: Commit governing log update
        shell: bash
        run: |
          if git diff --quiet -- docs/implementation-decision-log.md; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-decision-log.md
          git commit -m "Record approved SOL production decisions"
          git push origin HEAD:migration/solana-strategy-ready
