name: Sync D-047 decision log

on:
  push:
    branches:
      - feature/telegram-live-notifications

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-live-notifications
      - name: Append D-047 if missing
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^## D-047 — Telegram broker-confirmed live trade and safety notifications$' docs/implementation-decision-log.md; then
            echo 'D-047 already synchronized.'
            exit 0
          fi
          cat >> docs/implementation-decision-log.md <<'EOF'

## D-047 — Telegram broker-confirmed live trade and safety notifications

**Status:** APPROVED by owner on 2026-08-24; implementation completed on `feature/telegram-live-notifications` pending CI/merge/deployment verification.

Add owner-only automatic Telegram notifications for authoritative SOL production outcomes without changing `sol-outer-heavy-v1`, its ring geometry, sizing, execution ordering, account-risk rules, reconciliation behavior, or DXtrade order-routing semantics.

The owner approved individual notifications for each broker-confirmed grid entry, each broker-confirmed tranche exit, each fully closed virtual lot, and each completed inactivity-heartbeat round trip. Safety messages use a louder presentation than normal trade messages. Trade messages use the approved useful-middle detail level: ring, side, broker-confirmed fill price, confirmed quantity, virtual-lot identity, tranche when applicable, current MA/target context when safely available, and relevant durable state information.

A submitted or acknowledged DXtrade order must never be described as a fill. Grid trade notifications are queued only after the confirmed broker result has been accepted and the corresponding virtual-lot state transition has been durably saved. Heartbeat completion requires both legs to be confirmed. Reconciliation mismatch, account lockout, runtime safety halt, and confirmed protective flatten use explicit urgent alerts.

Telegram delivery is observational only. Delivery failure must never roll back a confirmed fill, retry an order, mutate virtual-lot/ring state, suppress or delay a protective action, or weaken an independent safety gate. Notification payloads are field-whitelisted and exclude credentials, raw broker payloads, owner identifiers, session tokens, and arbitrary transport/exception text.

PostgreSQL stores a durable notification identity before Telegram delivery. Already-claimed identities are not automatically resent after retry or restart, providing at-most-once delivery semantics and preventing duplicate success messages when delivery status is uncertain.

Affected files include `src/notifications/liveTelegramNotifications.js`, `src/runtime/solanaRuntime.js`, `src/runtime/solanaHeartbeat.js`, `src/state/solanaPersistence.js`, `src/telegramBot.js`, `index.mjs`, tests, README, and `docs/telegram-command-reference.md`.

Required verification: no fill notification before broker confirmation; durable state is saved before a grid fill notification is queued; duplicate identities are suppressed across restart; Telegram failure cannot alter trading state or trigger an order retry; all notification classes are format-tested; owner destination is the only automatic destination; no raw transport errors/secrets enter notification payloads; GitHub Actions pass; Railway deployment and Telegram behavior are verified before D-047 is marked deployment-complete.

Full decision: `docs/decisions/D-047-telegram-live-notifications.md`.
EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/implementation-decision-log.md
          git commit -m 'Sync D-047 into implementation decision log'
          git push origin HEAD:feature/telegram-live-notifications
