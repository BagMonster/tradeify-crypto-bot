name: Sync D-046 ring observability decision

on:
  push:
    branches:
      - feature/telegram-rings-levels
    paths:
      - .github/workflows/sync-d046.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-rings-levels
      - name: Append D-046 if missing
        shell: bash
        run: |
          marker='## D-046 — Telegram SOL ring observability'
          if grep -Fq "$marker" docs/implementation-decision-log.md; then
            echo "D-046 already present"
            exit 0
          fi
          cat >> docs/implementation-decision-log.md <<'EOF'

## D-046 — Telegram SOL ring observability

**Status:** APPROVED by owner on 2026-08-23.

Add owner-only, read-only `/rings` and `/levels` Telegram utilities. Both derive their prices and sizes from the frozen `sol-outer-heavy-v1` strategy definition and the same completed-day 200-day MA used by production. `/rings` compares the same live Binance `SOLUSDT` feed used by the strategy with the current ring ladder and reports dead-zone/ring-zone position plus the next BUY and SHORT levels. `/levels` displays all 8 BUY and 8 SHORT trigger prices, frozen USD sizes, estimated 0.01-SOL-rounded quantities, and persistent armed/occupied state. Both commands fail closed on missing/stale live price or unavailable MA and never submit orders or mutate strategy state. Add matching owner-only `Grid Levels` and `Ring Position` inline buttons and synchronize `/help`, Telegram command registration, README, and the operator command reference.

Full decision: `docs/decisions/D-046-telegram-ring-observability.md`.
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-decision-log.md
          git commit -m "Record D-046 Telegram SOL ring observability"
          git push origin HEAD:feature/telegram-rings-levels
