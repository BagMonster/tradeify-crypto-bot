name: Sync SOL activation decisions

on:
  push:
    branches:
      - activation/sol-final-live
    paths:
      - .github/workflows/sync-d042-d045.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: activation/sol-final-live
      - name: Append SOL activation decisions if missing
        shell: bash
        run: |
          append_if_missing() {
            local marker="$1"
            local body="$2"
            if grep -Fq "$marker" docs/implementation-decision-log.md; then
              echo "$marker already present"
            else
              printf '\n%s\n' "$body" >> docs/implementation-decision-log.md
            fi
          }

          append_if_missing '## D-042 — Owner-approved SOL live lifecycle canary' '## D-042 — Owner-approved SOL live lifecycle canary

**Status:** APPROVED by owner on 2026-08-23.

The owner explicitly approved the real SOL execution checkpoint. The canary is one 0.01 SOL DXtrade `SOL/USD` market BUY, confirmed broker fill, at least 25 seconds of hold time, exact linked-position close, confirmed close fill, and final flat-account verification. Canary state is durable and isolated from SOL ring state. Automatic production-grid execution remains off during the canary.

Full decision: `docs/decisions/D-042-owner-approved-sol-live-canary.md`.'

          append_if_missing '## D-043 — SOL canary open diagnostic follow-up' '## D-043 — SOL canary open diagnostic follow-up

**Status:** IMPLEMENTED on 2026-08-23.

After the first V1 canary open was not confirmed, the bot was changed to report persisted order status and current DXtrade broker-position state without submitting a replacement order. The V1 attempt remained PENDING while DXtrade reported the account flat.

Full decision: `docs/decisions/D-043-canary-open-diagnostic.md`.'

          append_if_missing '## D-044 — DXtrade SOL position-effect order shape' '## D-044 — DXtrade SOL position-effect order shape

**Status:** IMPLEMENTED and live-canary verified on 2026-08-23.

Account metadata confirmed `SOL/USD` minimum order size 0.01 SOL and increment 0.01 SOL. The SOL order path was corrected to use `positionEffect: OPEN` for new quantity orders and `positionEffect: CLOSE` with the exact broker `positionCode` for linked-position closes. Canary identifiers were advanced to V2 so the historical V1 PENDING attempt could never be resubmitted.

Full decision: `docs/decisions/D-044-dxtrade-position-effect-order-shape.md`.'

          append_if_missing '## D-045 — Final SOL live activation' '## D-045 — Final SOL live activation

**Status:** APPROVED by owner on 2026-08-23 after successful real lifecycle canary.

The V2 canary completed successfully: 0.01 SOL opened at $93.83, satisfied the project minimum hold, closed at $93.88 through the exact linked DXtrade position, and finished with the broker account flat and no pending order. The owner has repeatedly directed the project to get the bot started and provided standing approval to proceed without repeatedly requesting the same approval.

Automatic `sol-outer-heavy-v1` grid execution is authorized when `config/strategy.json` has `execution.autoExecute=true`, Railway has `APP_MODE=live` and `AUTO_EXECUTE=true`, and all existing runtime safety gates pass. The $1,500 daily-loss protection, account floors, approximately $1,830 gross virtual-exposure ceiling, owner pause, safety halt, account lockout, feed/account freshness, reconciliation, protective flatten, and 25-second project hold remain binding.

Full decision: `docs/decisions/D-045-final-sol-live-activation.md`.'
      - name: Commit governing log update
        shell: bash
        run: |
          if git diff --quiet -- docs/implementation-decision-log.md; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-decision-log.md
          git commit -m "Synchronize SOL activation decisions D-042 through D-045"
          git push origin HEAD:activation/sol-final-live
